<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بزرگ‌نمای بصری — Visual Magnifier</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #111; color: #eee;
         display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  h1 { font-size: 1.1rem; padding: 10px; }
  #video { display: none; }
  #canvas { max-width: 100%; border: 1px solid #333; border-radius: 8px; }
  #controls { padding: 12px; width: 100%; max-width: 480px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .row label { flex: 0 0 130px; font-size: 0.85rem; }
  .row input[type=range] { flex: 1; }
  .row output { flex: 0 0 52px; text-align: center; font-variant-numeric: tabular-nums; }
  button { padding: 10px 16px; font-size: 1rem; border: none; border-radius: 8px;
           background: #2b7de9; color: #fff; cursor: pointer; }
  button:disabled { background: #444; }
  select { background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px; }
</style>
</head>
<body>
<h1>بزرگ‌نمای بصری ارتعاشات خفیف</h1>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" width="640" height="480"></canvas>
<div id="controls">
  <div class="row">
    <label>بزرگ‌نمایی (x)</label>
    <input type="range" id="amp" min="1" max="200" value="50" step="1">
    <output id="ampOut">50</output>
  </div>
  <div class="row">
    <label>هموارسازی (Cutoff)</label>
    <input type="range" id="cutoff" min="0.01" max="0.9" value="0.2" step="0.01">
    <output id="cutOut">0.20</output>
  </div>
  <div class="row">
    <label>کف نویز</label>
    <input type="range" id="noise" min="0" max="30" value="4" step="0.5">
    <output id="noiseOut">4.0</output>
  </div>
  <div class="row">
    <label>حالت نمایش</label>
    <select id="mode">
      <option value="overlay">پوششی (Overlay)</option>
      <option value="heat" selected>نقشه حرارتی (Heatmap)</option>
    </select>
  </div>
  <button id="startBtn">شروع دوربین</button>
</div>

<script>
(function () {
  const video  = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d', { willReadFrequently: true });
  const startBtn = document.getElementById('startBtn');

  const ampIn = document.getElementById('amp'), ampOut = document.getElementById('ampOut');
  const cutIn = document.getElementById('cutoff'), cutOut = document.getElementById('cutOut');
  const noiseIn = document.getElementById('noise'), noiseOut = document.getElementById('noiseOut');
  const modeSel = document.getElementById('mode');

  ampIn.oninput   = () => ampOut.textContent = ampIn.value;
  cutIn.oninput   = () => cutOut.textContent = (+cutIn.value).toFixed(2);
  noiseIn.oninput = () => noiseOut.textContent = (+noiseIn.value).toFixed(1);

  // ---- Jet/Thermal colormap Look-Up Table (256 steps) ----
  const LUT = new Uint32Array(256);
  function jet(t) { // t in [0,1]: Blue -> Cyan -> Yellow -> Orange -> Red
    const r = Math.round(255 * Math.min(1, Math.max(0, 1.5 - Math.abs(4 * t - 3))));
    const g = Math.round(255 * Math.max(0, 1.5 - Math.abs(4 * t - 2))));
 t - 2))));
    const b = Math.round(255 * Math.min(1, Math.max(0, 1.5 - Math.abs(4 * t - 1))));
    return (255 << 24) | (b << 16) | (g << 8) | r;
  }
  for (let i = 0; i < 256; i++) LUT[i] = jet(i / 255);

  let processing = false;
  let lowBuf = null;  // IIR low-pass buffer (luma)
  let dPrev = null;   // previous frame's low-frequency difference

  startBtn.onclick = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
      });
      video.srcObject = stream;
      await video.play();
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      lowBuf = null; dPrev = null;
      processing = true;
      startBtn.disabled = true;
      requestAnimationFrame(loop);
    } catch (e) {
      alert('دسترسی به دوربین ممکن نشد: ' + e.message);
    }
  };

  function loop() {
    if (!processing) return;
    processFrame();
    requestAnimationFrame(loop);
  }

  function processFrame() {
    const w = canvas.width, h = canvas.height;
    ctx.drawImage(video, 0, 0, w, h);
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;

    if (!lowBuf) {
      lowBuf = new Float32Array(w * h);
      dPrev = new Float32Array(w * h);
    }
    const alpha = +cutIn.value;        // IIR smoothing factor
    const amp = +ampIn.value;          // magnification factor (1-200x)
    const noiseFloor = +noiseIn.value; // sensor noise gating
    const heat = modeSel.value === 'heat';
    const diffScale = 255 / 60;        // ~60 luma-units of amplified motion -> full colormap

    const out = new Uint32Array(img.data.buffer);
    for (let i = 0, p = 0; i < lowBuf.length; i++, p += 4) {
      const gray = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
      lowBuf[i] += alpha * (gray - lowBuf[i]);       // temporal low-pass
      const diff = gray - lowBuf[i];                 // current motion signal
      const motion = Math.max(0, Math.abs(diff - dPrev[i]) * amp); // frame-to-frame change
      dPrev[i] += alpha * (diff - dPrev[i]);

      let v = motion < noiseFloor ? 0 : motion;      // noise floor gating

      if (heat) {
        out[i] = LUT[Math.min(255, (v * diffScale) | 0)];
      } else {
        // Overlay: amplified motion blended over the original frame
        const add = Math.min(255, v);
        out[i] = (255 << 24) |
                 (Math.min(255, d[p + 2] + add) << 16) |
                 (Math.min(255, d[p + 1] + add * 0.5) << 8) |
                 Math.min(255, d[p] + add * 0.2);
      }
    }
    ctx.putImageData(img, 0, 0);
  }
})();
</script>
</body>
</html>
