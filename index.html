<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Vibration & Motion Magnifier</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    h2 { font-size: 1.1rem; margin-bottom: 8px; text-align: center; }
    #view-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    video { display: none; }
    .controls {
      width: 100%;
      max-width: 480px;
      margin-top: 14px;
      background: #1e1e1e;
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.9rem;
    }
    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .slider-row label { flex: 1; }
    .slider-row input[type="range"] { flex: 1.5; margin: 0 8px; }
    .slider-row span { width: 45px; text-align: right; font-family: monospace; }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    button {
      flex: 1;
      padding: 10px;
      background: #0070f3;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { background: #0051b3; }
    .tip {
      font-size: 0.75rem;
      color: #888;
      margin-top: 8px;
      text-align: center;
      max-width: 480px;
    }
  </style>
</head>
<body>

  <h2>🔬 Real-Time Vibration Magnifier</h2>

  <div id="view-container">
    <canvas id="outputCanvas"></canvas>
  </div>
  <video id="webcam" playsinline autoplay></video>

  <div class="controls">
    <div class="slider-row">
      <label for="amp">Amplification:</label>
      <input id="amp" type="range" min="1" max="80" value="40" step="1" />
      <span id="ampVal">40x</span>
    </div>

    <div class="slider-row">
      <label for="cutoff">Cutoff (Smoothing):</label>
      <input id="cutoff" type="range" min="0.05" max="0.95" value="0.75" step="0.05" />
      <span id="cutoffVal">0.75</span>
    </div>

    <div class="slider-row">
      <label for="mode">Display Mode:</label>
      <select id="mode" style="background:#2a2a2a; color:#fff; padding:4px 8px; border-radius:4px; border:1px solid #444;">
        <option value="overlay">Overlaid on Video</option>
        <option value="diff">High-Contrast Vibration Only</option>
      </select>
    </div>

    <div class="btn-row">
      <button id="switchCamBtn">Switch Camera</button>
      <button id="freezeRefBtn">Reset Filter</button>
    </div>
  </div>

  <p class="tip">📌 Keep your phone completely stationary (prop it against a solid object or mount it). Tiny high-frequency vibrations will be amplified.</p>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const ampSlider = document.getElementById('amp');
    const ampVal = document.getElementById('ampVal');
    const cutoffSlider = document.getElementById('cutoff');
    const cutoffVal = document.getElementById('cutoffVal');
    const modeSelect = document.getElementById('mode');
    const switchCamBtn = document.getElementById('switchCamBtn');
    const resetBtn = document.getElementById('freezeRefBtn');

    let currentFacingMode = 'environment'; // Rear camera default
    let stream = null;

    // Filter state buffers
    let lowpassBuffer = null;
    let width = 320;
    let height = 240;

    ampSlider.addEventListener('input', (e) => ampVal.innerText = `${e.target.value}x`);
    cutoffSlider.addEventListener('input', (e) => cutoffVal.innerText = e.target.value);

    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: currentFacingMode },
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        // Downscale for real-time mobile performance
        width = 320;
        height = Math.round((video.videoHeight / video.videoWidth) * width) || 240;
        canvas.width = width;
        canvas.height = height;
        lowpassBuffer = null;
        requestAnimationFrame(processFrame);
      } catch (err) {
        alert("Camera error: " + err.message);
      }
    }

    switchCamBtn.addEventListener('click', () => {
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      startCamera();
    });

    resetBtn.addEventListener('click', () => {
      lowpassBuffer = null;
    });

    // Temporal highpass/bandpass motion amplifier
    function processFrame() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, width, height);
        const frame = ctx.getImageData(0, 0, width, height);
        const data = frame.data;
        const totalPixels = width * height * 4;

        if (!lowpassBuffer || lowpassBuffer.length !== totalPixels) {
          lowpassBuffer = new Float32Array(totalPixels);
          for (let i = 0; i < totalPixels; i++) {
            lowpassBuffer[i] = data[i];
          }
        }

        const alpha = parseFloat(cutoffSlider.value);
        const gain = parseFloat(ampSlider.value);
        const isDiffOnly = modeSelect.value === 'diff';

        for (let i = 0; i < totalPixels; i += 4) {
          // IIR filter: update running lowpass base for R, G, B
          for (let c = 0; c < 3; c++) {
            const current = data[i + c];
            const prevLow = lowpassBuffer[i + c];
            
            // Low-pass component
            const newLow = prevLow + alpha * (current - prevLow);
            lowpassBuffer[i + c] = newLow;

            // Temporal high-pass vibration component = current - lowpass
            const highpass = current - newLow;

            if (isDiffOnly) {
              // Center at 128 for vibration-only visualization
              data[i + c] = Math.min(255, Math.max(0, 128 + highpass * gain));
            } else {
              // Add amplified vibration on top of the original video feed
              data[i + c] = Math.min(255, Math.max(0, current + highpass * gain));
            }
          }
          data[i + 3] = 255; // Alpha channel
        }

        ctx.putImageData(frame, 0, 0);
      }
      requestAnimationFrame(processFrame);
    }

    startCamera();
  </script>
</body>
</html>
